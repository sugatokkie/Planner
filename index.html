<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리아이 공부방 리포트</title>
    <!-- 구글 폰트 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fdf4f5', 100: '#fbe8eb', 500: '#e0566fd', 600: '#c83e58', 700: '#aa2d45' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- Firebase SDK (Firestore 전용 - 카드 등록 불필요) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7GjBEOPa56EoFBdL4NlMNa19F5dH7J5E",
            authDomain: "study-room-app-e7bad.firebaseapp.com",
            projectId: "study-room-app-e7bad",
            storageBucket: "study-room-app-e7bad.firebasestorage.app",
            messagingSenderId: "439462698986",
            appId: "1:439462698986:web:e19282ba7aaed50689dc93"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.FB_DB = db;
        window.FB_operations = { collection, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc };
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- 상단 네비게이션 -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-400 flex items-center justify-center text-white font-bold shadow-sm shadow-rose-200">✨</div>
                <span class="font-bold text-lg text-slate-900 tracking-tight">공부방 성장 리포트</span>
            </div>
            <div id="nav-badge" class="text-xs font-medium px-3 py-1.5 rounded-full bg-slate-100 text-slate-600">
                클라우드 연결 중...
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow" id="app-container">
        <div class="text-center py-20 text-slate-400 text-sm">구글 클라우드 데이터를 불러오는 중입니다...</div>
    </main>

    <!-- 푸터 -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-100 mt-12">
        &copy; 2026 Study Room Feedback System. All rights reserved.
    </footer>

    <!-- 앱 비즈니스 로직 -->
    <script>
        window.addEventListener('firebase-ready', () => {
            initApp();
        });

        function getDb() { return window.FB_DB; }
        const ops = () => window.FB_operations;

        async function fetchAllStudents() {
            try {
                const querySnapshot = await ops().getDocs(ops().collection(getDb(), "students"));
                let list = [];
                querySnapshot.forEach((docSnap) => {
                    list.push({ id: docSnap.id, ...docSnap.data() });
                });
                return list;
            } catch (err) {
                console.error("데이터 로딩 실패:", err);
                return [];
            }
        }

        async function fetchStudentById(studentId) {
            try {
                const docRef = ops().doc(getDb(), "students", studentId);
                const docSnap = await ops().getDoc(docRef);
                if (docSnap.exists()) {
                    return { id: docSnap.id, ...docSnap.data() };
                }
                return null;
            } catch (err) {
                console.error("학생 조회 실패:", err);
                return null;
            }
        }

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            let studentId = urlParams.get('student');

            if (!studentId && window.location.hash.includes('student=')) {
                const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
                studentId = hashParams.get('student');
            }

            window.CURRENT_STUDENT_ID = studentId;

            if (studentId) {
                renderParentView(studentId, false);
            } else {
                renderTeacherView();
            }
        }

        function goHome() {
            window.location.href = window.location.pathname;
        }

        // 1. 선생님 대시보드 화면
        async function renderTeacherView() {
            if (window.CURRENT_STUDENT_ID) return;

            const badge = document.getElementById('nav-badge');
            if (badge) {
                badge.innerHTML = '👩‍🏫 선생님 모드';
                badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-full bg-rose-50 text-rose-600 border border-rose-100';
            }

            document.getElementById('app-container').innerHTML = `<div class="text-center py-20 text-slate-400 text-sm">학생 목록 동기화 중...</div>`;
            const students = await fetchAllStudents();

            let html = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-gradient-to-r from-rose-500 to-pink-500 p-6 rounded-3xl text-white shadow-lg shadow-rose-500/10">
                        <div>
                            <h1 class="text-2xl font-bold">우리 공부방 학생 관리</h1>
                            <p class="text-rose-100 text-sm mt-1">학생 이름을 눌러 피드백과 사진을 바로 등록하세요.</p>
                        </div>
                        <button onclick="openAddStudentModal()" class="bg-white text-rose-600 font-semibold px-5 py-2.5 rounded-2xl shadow-sm hover:bg-rose-50 transition active:scale-95 text-sm flex items-center justify-center space-x-1.5">
                            <span>＋ 새 학생 등록</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;

            if (students.length === 0) {
                html += `
                    <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-slate-100 shadow-sm">
                        <p class="text-slate-400 text-sm">등록된 학생이 없습니다. 상단 버튼을 눌러 학생을 추가해주세요.</p>
                    </div>
                `;
            } else {
                students.forEach(s => {
                    const parentLink = `${window.location.origin}${window.location.pathname}?student=${s.id}`;
                    html += `
                        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between cursor-pointer group" onclick="openTeacherManagePage('${s.id}')" title="관리 페이지로 이동">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 font-bold text-lg flex items-center justify-center group-hover:bg-rose-100 transition">${s.name.charAt(0)}</div>
                                        <div>
                                            <h3 class="font-bold text-lg text-slate-900 group-hover:text-rose-600 transition flex items-center gap-1.5">
                                                ${s.name} <span class="text-[10px] bg-rose-50 text-rose-600 px-2 py-0.5 rounded-full font-semibold">피드백 관리 ✍️</span>
                                            </h3>
                                            <p class="text-xs text-slate-400">${s.grade} · ${s.subject}</p>
                                        </div>
                                    </div>
                                    <button onclick="event.stopPropagation(); deleteStudent('${s.id}')" class="text-slate-300 hover:text-rose-500 text-xs px-2 py-1">학생삭제</button>
                                </div>

                                <div class="mt-4 pt-4 border-t border-slate-50 space-y-2 text-xs text-slate-600">
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">출석상태</span>
                                        <span class="font-medium text-slate-700">${s.attendance || '미기재'}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">오늘 숙제</span>
                                        <span class="font-medium text-slate-700 truncate max-w-[180px]">${s.homework || '미기재'}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">등록된 피드백</span>
                                        <span class="font-medium text-rose-600">${s.feedbacks ? s.feedbacks.length : 0}개</span>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-5 pt-4 border-t border-slate-100 flex items-center gap-2">
                                <button onclick="openTeacherManagePage('${s.id}')" class="flex-1 bg-slate-900 text-white font-medium py-2.5 rounded-xl text-xs hover:bg-slate-800 transition">
                                    피드백 작성 및 관리
                                </button>
                                <button onclick="copyParentLink('${parentLink}')" class="bg-rose-50 text-rose-600 font-medium px-3.5 py-2.5 rounded-xl text-xs hover:bg-rose-100 transition flex items-center justify-center" title="학부모 링크 복사">
                                    🔗 링크복사
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            document.getElementById('app-container').innerHTML = html;
        }

        async function openTeacherManagePage(studentId) {
            window.scrollTo(0, 0);
            renderParentView(studentId, false, true);
        }

        // 2. 학생 상세 페이지
        async function renderParentView(studentId, isPureParent = true, isTeacherMode = false) {
            const badge = document.getElementById('nav-badge');
            if (badge) {
                if (isTeacherMode) {
                    badge.innerHTML = '✍️ 선생님 관리 모드';
                    badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-full bg-rose-50 text-rose-600 border border-rose-100';
                } else {
                    badge.innerHTML = '🌸 학부모 전용 페이지';
                    badge.className = 'text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100';
                }
            }

            document.getElementById('app-container').innerHTML = `<div class="text-center py-20 text-slate-400 text-sm">리포트 로딩 중...</div>`;
            const student = await fetchStudentById(studentId);

            if (!student) {
                document.getElementById('app-container').innerHTML = `
                    <div class="text-center py-24 bg-white rounded-3xl border border-slate-100 shadow-sm max-w-md mx-auto mt-12 p-8">
                        <div class="text-4xl mb-3">🔍</div>
                        <h2 class="text-lg font-bold text-slate-800">학생 정보를 찾을 수 없습니다</h2>
                        <p class="text-slate-400 text-xs mt-1 mb-6">링크가 올바르지 않거나 삭제된 학생 정보입니다.</p>
                        <button onclick="goHome()" class="bg-slate-900 text-white text-xs font-medium px-5 py-2.5 rounded-xl">홈으로 가기</button>
                    </div>
                `;
                return;
            }

            let feedbacksHtml = '';
            if (!student.feedbacks || student.feedbacks.length === 0) {
                feedbacksHtml = `
                    <div class="text-center py-12 bg-white rounded-3xl border border-slate-100 text-slate-400 text-xs">
                        아직 등록된 피드백이 없습니다.
                    </div>
                `;
            } else {
                student.feedbacks.slice().reverse().forEach(f => {
                    feedbacksHtml += `
                        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                            <div class="flex items-center justify-between text-xs text-slate-400">
                                <span class="font-semibold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg">선생님 피드백</span>
                                <div class="flex items-center space-x-2">
                                    <span>${f.date}</span>
                                    ${isTeacherMode ? `
                                        <button onclick="openEditFeedbackModal('${student.id}', '${f.id}')" class="text-slate-400 hover:text-slate-700 px-1 font-medium">수정</button>
                                        <button onclick="deleteFeedback('${student.id}', '${f.id}')" class="text-rose-400 hover:text-rose-600 px-1 font-medium">삭제</button>
                                    ` : ''}
                                </div>
                            </div>
                            <p class="text-slate-700 text-sm leading-relaxed whitespace-pre-line">${f.text}</p>
                            ${f.imageUrl ? `<div class="rounded-2xl overflow-hidden border border-slate-100"><img src="${f.imageUrl}" class="w-full object-cover max-h-96" alt="피드백 사진"></div>` : ''}
                        </div>
                    `;
                });
            }

            let html = `<div class="max-w-xl mx-auto space-y-6">`;

            if (isTeacherMode) {
                html += `
                    <button onclick="renderTeacherView()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-2xl transition flex items-center space-x-1.5">
                        <span>← 전체 학생 목록으로 돌아가기</span>
                    </button>

                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-slate-900">📋 출석 및 숙제 상태 수정</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">출석 상태</label>
                                <input type="text" id="quick-attendance" value="${student.attendance || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">오늘 숙제 / 진도</label>
                                <input type="text" id="quick-homework" value="${student.homework || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                            </div>
                        </div>
                        <button onclick="saveQuickStatus('${student.id}')" class="w-full bg-slate-900 text-white py-2 rounded-xl text-xs font-semibold hover:bg-slate-800 transition">출석/숙제 상태 저장</button>
                    </div>

                    <!-- 새 피드백 작성 카드 (사진 바로 선택 가능) -->
                    <div class="bg-gradient-to-br from-rose-50 to-pink-50 p-6 rounded-3xl border border-rose-100 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-rose-900">✍️ 새로운 피드백 & 사진 첨부하기</h3>
                        <div>
                            <textarea id="new-feedback-text" rows="3" class="w-full bg-white border border-rose-200 rounded-2xl p-3 text-xs focus:outline-none focus:border-rose-500" placeholder="학부모님께 전달할 아이의 수업 태도, 칭찬할 점을 적어주세요."></textarea>
                        </div>
                        <div>
                            <label class="text-[11px] text-rose-700 font-semibold block mb-1">📷 사진 파일 선택 (폰 갤러리 / PC 사진 바로 업로드)</label>
                            <input type="file" id="new-feedback-file" accept="image/*" class="w-full bg-white border border-rose-200 rounded-xl px-3 py-2 text-xs file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                        </div>
                        <button id="submit-btn" onclick="addNewFeedback('${student.id}')" class="w-full bg-rose-600 text-white py-3 rounded-xl text-xs font-semibold hover:bg-rose-700 shadow-sm transition">피드백 등록하기</button>
                    </div>
                `;
            }

            html += `
                    <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-3xl text-white shadow-xl">
                        <div class="flex items-center space-x-3">
                            <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center text-2xl font-bold">${student.name.charAt(0)}</div>
                            <div>
                                <span class="text-xs text-rose-400 font-semibold uppercase tracking-wider">우리 아이 공부방 리포트</span>
                                <h1 class="text-xl font-bold mt-0.5">${student.name} 학생</h1>
                            </div>
                        </div>
                        <div class="mt-6 pt-4 border-t border-white/10 grid grid-cols-2 gap-4 text-xs">
                            <div>
                                <span class="text-slate-400 block">오늘 출석 상태</span>
                                <span class="font-medium text-emerald-400 mt-0.5 block">${student.attendance || '확인 전'}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block">오늘 숙제 및 진도</span>
                                <span class="font-medium text-white mt-0.5 block truncate">${student.homework || '숙제 없음'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h2 class="font-bold text-slate-800 px-1 text-sm flex items-center justify-between">
                            <span>💬 선생님 코멘트 & 활동 피드백</span>
                            <span class="text-xs font-normal text-slate-400">총 ${student.feedbacks ? student.feedbacks.length : 0}개</span>
                        </h2>
                        ${feedbacksHtml}
                    </div>
                </div>
            `;
            document.getElementById('app-container').innerHTML = html;
        }

        // 학생 등록 모달
        function openAddStudentModal() {
            const modalHtml = `
                <div id="custom-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">새 학생 등록</h3>
                        <form onsubmit="handleCreateStudent(event)" class="space-y-3">
                            <div>
                                <label class="text-xs text-slate-500 font-medium block mb-1">학생 이름</label>
                                <input type="text" id="new-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500" placeholder="예: 김민준">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 font-medium block mb-1">학년/학교</label>
                                <input type="text" id="new-grade" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500" placeholder="예: 초등학교 4학년">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 font-medium block mb-1">대표 과목</label>
                                <input type="text" id="new-subject" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500" placeholder="예: 초등 수학교실">
                            </div>
                            <div class="flex space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl text-xs font-semibold">취소</button>
                                <button type="submit" class="flex-1 bg-rose-600 text-white py-3 rounded-xl text-xs font-semibold hover:bg-rose-700">등록하기</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function handleCreateStudent(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value;
            const grade = document.getElementById('new-grade').value;
            const subject = document.getElementById('new-subject').value;

            const newId = 's_' + Math.random().toString(36).substring(2, 9);
            const newStudent = {
                name,
                grade,
                subject,
                attendance: '미출석',
                homework: '없음',
                feedbacks: []
            };

            try {
                await ops().setDoc(ops().doc(getDb(), "students", newId), newStudent);
                closeModal();
                renderTeacherView();
            } catch (err) {
                console.error("학생 등록 오류:", err);
                alert("학생 등록 중 오류가 발생했습니다.");
            }
        }

        async function saveQuickStatus(studentId) {
            const attendance = document.getElementById('quick-attendance').value;
            const homework = document.getElementById('quick-homework').value;

            try {
                const docRef = ops().doc(getDb(), "students", studentId);
                await ops().updateDoc(docRef, { attendance, homework });
                alert('출석 및 숙제 정보가 저장되었습니다.');
                openTeacherManagePage(studentId);
            } catch (err) {
                console.error("상태 저장 오류:", err);
                alert("저장 중 오류가 발생했습니다.");
            }
        }

        // 이미지 파일을 읽어서 Base64 문자열로 변환하는 헬퍼 함수 (무료 DB 저장용)
        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 새 피드백 작성 (사진 선택 시 즉시 변환되어 클라우드 DB에 저장)
        async function addNewFeedback(studentId) {
            const text = document.getElementById('new-feedback-text').value;
            const fileInput = document.getElementById('new-feedback-file');
            const submitBtn = document.getElementById('submit-btn');

            if (!text.trim()) {
                alert('피드백 내용을 입력해주세요.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '사진 변환 및 등록 중...';

            try {
                let imageUrl = '';
                
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    // 이미지 용량 최적화를 위해 바이트 변환
                    imageUrl = await readFileAsDataURL(file);
                }

                const student = await fetchStudentById(studentId);
                if (!student) return;

                const today = new Date().toISOString().split('T')[0];
                const newFeedback = {
                    id: 'f_' + Math.random().toString(36).substring(2, 9),
                    date: today,
                    text,
                    imageUrl
                };

                const updatedFeedbacks = [...(student.feedbacks || []), newFeedback];
                const docRef = ops().doc(getDb(), "students", studentId);
                await ops().updateDoc(docRef, { feedbacks: updatedFeedbacks });

                alert('피드백과 사진이 성공적으로 등록되었습니다!');
                openTeacherManagePage(studentId);
            } catch (err) {
                console.error("피드백 등록 오류:", err);
                alert("등록 중 오류가 발생했습니다. 사진 용량이 너무 크면 줄여서 시도해 주세요.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '피드백 등록하기';
            }
        }

        async function openEditFeedbackModal(studentId, feedbackId) {
            const student = await fetchStudentById(studentId);
            if (!student) return;
            const f = student.feedbacks.find(item => item.id === feedbackId);
            if (!f) return;

            const modalHtml = `
                <div id="custom-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-lg text-slate-900">피드백 수정</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold px-2">✕</button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">코멘트 내용</label>
                                <textarea id="edit-feedback-text" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs focus:outline-none focus:border-rose-500">${f.text}</textarea>
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">새로운 사진으로 교체 (선택사항)</label>
                                <input type="file" id="edit-feedback-file" accept="image/*" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                            </div>
                            <button id="edit-submit-btn" onclick="saveEditedFeedback('${student.id}', '${f.id}', '${f.imageUrl || ''}')" class="w-full bg-rose-600 text-white py-3 rounded-xl text-xs font-semibold hover:bg-rose-700 transition">수정 완료하기</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function saveEditedFeedback(studentId, feedbackId, oldImageUrl) {
            const text = document.getElementById('edit-feedback-text').value;
            const fileInput = document.getElementById('edit-feedback-file');
            const editBtn = document.getElementById('edit-submit-btn');

            if (!text.trim()) {
                alert('내용을 입력해주세요.');
                return;
            }

            editBtn.disabled = true;
            editBtn.innerHTML = '수정 중...';

            try {
                let imageUrl = oldImageUrl;

                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    imageUrl = await readFileAsDataURL(file);
                }

                const student = await fetchStudentById(studentId);
                if (!student) return;

                const updatedFeedbacks = student.feedbacks.map(f => {
                    if (f.id === feedbackId) {
                        return { ...f, text, imageUrl };
                    }
                    return f;
                });

                const docRef = ops().doc(getDb(), "students", studentId);
                await ops().updateDoc(docRef, { feedbacks: updatedFeedbacks });

                closeModal();
                alert('피드백이 수정되었습니다.');
                openTeacherManagePage(studentId);
            } catch (err) {
                console.error("수정 오류:", err);
                alert("수정 중 오류가 발생했습니다.");
                editBtn.disabled = false;
                editBtn.innerHTML = '수정 완료하기';
            }
        }

        async function deleteFeedback(studentId, feedbackId) {
            if (!confirm('이 피드백을 삭제하시겠습니까?')) return;

            try {
                const student = await fetchStudentById(studentId);
                if (!student) return;

                const updatedFeedbacks = student.feedbacks.filter(item => item.id !== feedbackId);
                const docRef = ops().doc(getDb(), "students", studentId);
                await ops().updateDoc(docRef, { feedbacks: updatedFeedbacks });

                alert('피드백이 삭제되었습니다.');
                openTeacherManagePage(studentId);
            } catch (err) {
                console.error("삭제 오류:", err);
                alert("삭제 중 오류가 발생했습니다.");
            }
        }

        async function deleteStudent(studentId) {
            if (!confirm('정말 이 학생 정보를 삭제하시겠습니까?')) return;

            try {
                await ops().deleteDoc(ops().doc(getDb(), "students", studentId));
                renderTeacherView();
            } catch (err) {
                console.error("학생 삭제 오류:", err);
                alert("삭제 중 오류가 발생했습니다.");
            }
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            if (modal) modal.remove();
        }

        function copyParentLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('학부모 전용 링크가 클립보드에 복사되었습니다! 카카오톡이나 문자로 학부모님께 전달하세요.');
            }).catch(() => {
                prompt('아래 링크를 복사해주세요:', url);
            });
        }
    </script>
</body>
</html>
